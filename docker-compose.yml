services:
  postgres:
    image: postgres:17
    container_name: secondbrain-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: secondbrain
      POSTGRES_USER: secondbrain
      POSTGRES_PASSWORD: fsociety

    ports:
      - "5435:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: