[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "secondbrain"
version = "0.1.0"
description = "Personal knowledge management and AI system"
requires-python = ">=3.13"

dependencies = [
    "pytest>=9.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.1",
    "alembic>=1.16",
    "pwdlib[argon2]>=0.2",
    "pydantic[email]>=2.0",
    "PyJWT>=2.10"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]